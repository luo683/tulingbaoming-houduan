server:
  port: 8080

spring:
  # H2 文件数据库（无需安装 MySQL，数据落在本地 ./data/turing.mv.db）
  # 想换回 MySQL：注释掉 datasource 与 h2 两段，恢复 db/mysql 配置即可
  datasource:
    url: jdbc:h2:file:./data/turing;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # H2 控制台（浏览器访问 http://localhost:8080/h2-console）
  h2:
    console:
      enabled: true
      path: /h2-console

  # 禁用 SQL 脚本自动执行（src/main/resources 下的 *.mysql.bak 是 MySQL 语法，H2 不认）
  # 注意：必须放在顶层 spring: 之下，放到自定义前缀（如 ai:）下面会被忽略
  sql:
    init:
      mode: never

  # JPA 自动建表（update = 保留已有数据，只补齐结构差异）
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # 缓存改走进程内实现（com.tuling.config.LocalCache），不再依赖 Redis 服务。
  # 需要多实例共享状态时，恢复 spring-boot-starter-data-redis 依赖并取消下面的注释。
  # redis:
  #   host: ${REDIS_HOST:localhost}
  #   port: ${REDIS_PORT:6379}
  #   password:
  #   timeout: 2000ms
  #   connect-timeout: 2000ms
  #   lettuce:
  #     pool:
  #       max-active: 8
  #       max-idle: 8
  #       min-idle: 0
  #     shutdown-timeout: 100ms

# AI 大模型配置（硅基流动 SiliconFlow 免费模型）
ai:
  model:
    # 硅基流动 API 地址
    base-url: https://api.siliconflow.cn/v1
    # 硅基流动 API Key
    api-key: ${SILICONFLOW_API_KEY:}
    # 文本生成模型：Qwen2.5-7B-Instruct
    model-name: Qwen/Qwen2.5-7B-Instruct
    # 温度参数
    temperature: 0.7
    # 最大输出 token 数
    max-tokens: 2048

  # Embedding 向量模型配置（硅基流动 BAAI/bge-m3）
  embedding:
    base-url: https://api.siliconflow.cn/v1
    api-key: ${SILICONFLOW_API_KEY:}
    model-name: BAAI/bge-m3

  # RAG 知识库配置（使用硅基流动 BAAI/bge-m3 向量检索）
  rag:
    # 知识库文件路径（classpath 下）
    knowledge-path: knowledge/tuling-knowledge.txt
    # 文本分块大小
    chunk-size: 500
    # 分块重叠大小
    chunk-overlap: 50
    # 检索返回的最相关文档数
    max-results: 3

  # 限流配置
  rate-limit:
    # 每个 IP 每分钟最大请求数
    max-requests-per-minute: 10
    # 限流窗口（秒）
    window-seconds: 60
