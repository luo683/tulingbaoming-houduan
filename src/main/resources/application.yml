server:
  port: 8080

spring:
  # MySQL 数据源
  datasource:
    url: jdbc:mysql://localhost:3306/turing?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 自动建表
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  # Redis 配置（可选 — 不可用时服务自动降级）
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password:
    timeout: 2000ms
    connect-timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
      shutdown-timeout: 100ms

# AI 大模型配置（硅基流动 SiliconFlow 免费模型）
ai:
  model:
    # 硅基流动 API 地址
    base-url: https://api.siliconflow.cn/v1
    # 硅基流动 API Key
    api-key: ${SILICONFLOW_API_KEY:}
    # 文本生成模型：Qwen2.5-7B-Instruct
    model-name: Qwen/Qwen2.5-7B-Instruct
    # 温度参数
    temperature: 0.7
    # 最大输出 token 数
    max-tokens: 2048

  # Embedding 向量模型配置（硅基流动 BAAI/bge-m3）
  embedding:
    base-url: https://api.siliconflow.cn/v1
    api-key: ${SILICONFLOW_API_KEY:}
    model-name: BAAI/bge-m3

  # RAG 知识库配置（使用硅基流动 BAAI/bge-m3 向量检索）
  rag:
    # 知识库文件路径（classpath 下）
    knowledge-path: knowledge/tuling-knowledge.txt
    # 文本分块大小
    chunk-size: 500
    # 分块重叠大小
    chunk-overlap: 50
    # 检索返回的最相关文档数
    max-results: 3

  # 限流配置
  rate-limit:
    # 每个 IP 每分钟最大请求数
    max-requests-per-minute: 10
    # 限流窗口（秒）
    window-seconds: 60
